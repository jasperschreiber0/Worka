name: Ops - hit an arbitrary /api/cron/* route

# Temporary diagnostic runner: calls scripts/trigger-cron-route.mjs against
# a caller-specified ROUTE_PATH, using the same APP_URL/CRON_SECRET repo
# secrets every other cron workflow already uses. Exists to let a chat-only
# debugging session hit a live route (e.g. a temporary diagnostic route)
# without needing direct network access to Railway. Delete once the
# current investigation is done.

on:
  workflow_dispatch:
    inputs:
      route_path:
        description: 'Path under /api/cron/ to call, e.g. /api/cron/env-check'
        required: true
        type: string

jobs:
  hit-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hit route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ROUTE_PATH: ${{ inputs.route_path }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/trigger-cron-route.mjs
