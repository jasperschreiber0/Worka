name: Intake recovery cron

# Fires GET /api/cron/intake-recovery on a schedule — see
# scripts/trigger-cron-route.mjs and CLAUDE.md's "Independent Intake
# Recovery Service" for what that route does and why it needs to run
# frequently (its own staleness windows are 3-6 minutes; a stuck upload
# should self-heal within one cycle of this schedule).
#
# This app is hosted on Railway, not Vercel (see CLAUDE.md's "Hosting"
# note) — vercel.json's cron entries are never read by anything, since
# Railway doesn't consult that file. This workflow (or an equivalent
# Railway-native Cron Job service running the same script) is the actual
# scheduler. GitHub Actions' own scheduler is best-effort and can slip by
# several minutes under load — acceptable here since every run is
# idempotent and a late/skipped run just means recovery takes one cycle
# longer, not incorrect; use a Railway Cron Job instead if you need a
# tighter guarantee.
#
# Requires two repo secrets: APP_URL (the app's real, currently-live URL —
# check Railway → Networking, don't assume a domain) and CRON_SECRET (must
# match the value set on Railway → Variables for this service — NOT just
# on Vercel, which does not run this app).

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes — GitHub Actions' documented minimum interval
  workflow_dispatch: {}

concurrency:
  group: intake-recovery-cron
  cancel-in-progress: false

jobs:
  trigger-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Trigger intake recovery
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ROUTE_PATH: /api/cron/intake-recovery
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/trigger-cron-route.mjs
