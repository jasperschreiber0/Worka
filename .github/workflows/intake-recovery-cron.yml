name: Intake recovery cron

# Manually-triggerable only — see below for why the schedule was removed.
#
# Fires GET /api/cron/intake-recovery — see scripts/trigger-cron-route.mjs
# and CLAUDE.md's "Independent Intake Recovery Service" for what that route
# does.
#
# SCHEDULE REMOVED (2026-08-23): this workflow used to fire every 5 minutes
# alongside pg_cron's own 1-minute native schedule (migration 038,
# `worka-intake-recovery`) hitting the exact same route — two independent
# schedulers invoking the same handler concurrently. Production evidence
# traced a real incident to this: an expired, non-extension-eligible
# estimate_runs row (stage3_failure_count > 0, so migration 089's deadline
# extension doesn't apply) sat non-terminal for ~8h56m despite pg_cron
# firing every minute with zero route errors — enforce_estimate_deadlines()
# uses `FOR UPDATE SKIP LOCKED` in its finalization loop, so a second
# concurrent invocation (from this workflow) could silently skip an
# eligible row without ever surfacing as an error, for however many ticks
# the two schedulers happened to overlap.
#
# pg_cron is the sole authoritative production scheduler now — it already
# fires every minute (tighter than this workflow's 5), runs inside the same
# database (no cross-network dependency), and doesn't degrade the way
# GitHub Actions' own scheduler can under load (CLAUDE.md's "Hosting" note
# documents GitHub Actions' schedule occasionally slipping to ~once/hour
# for a low-traffic repo — which is exactly why pg_cron was added as the
# primary trigger in the first place; this workflow was only ever meant as
# a harmless redundant secondary, not a second authority). Kept as
# workflow_dispatch-only so it's still available for manual/on-demand
# triggering (e.g. targeted verification of a specific batch) without
# ever firing automatically again.
#
# Requires two repo secrets: APP_URL (the app's real, currently-live URL —
# check Railway → Networking, don't assume a domain) and CRON_SECRET (must
# match the value set on Railway → Variables for this service — NOT just
# on Vercel, which does not run this app).

on:
  workflow_dispatch: {}

concurrency:
  group: intake-recovery-cron
  cancel-in-progress: false

jobs:
  trigger-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Trigger intake recovery
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ROUTE_PATH: /api/cron/intake-recovery
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/trigger-cron-route.mjs
