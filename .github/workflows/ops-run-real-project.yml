name: Ops - run one real project through the real pipeline

# Temporary, on-demand runner for scripts/dev-run-real-project-e2e.mjs —
# drives one real residential project through the real production
# document-worker/smooth-responder pipeline plus real pricing/QA, and polls
# for estimate_runs.builder_status set by the real pg_cron reconcile sweep.
# Delete once the project reaches ESTIMATE_READY / ESTIMATE_READY_WITH_WARNINGS
# and this validation task is done.

on:
  workflow_dispatch: {}

jobs:
  run-real-project:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Run real project through the real pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node --experimental-strip-types scripts/dev-run-real-project-e2e.mjs
