name: Deploy Supabase migrations

# Applies pending SQL migrations to the production Supabase project whenever
# supabase/migrations/** changes on main, then reloads PostgREST's schema
# cache. Migrations landing on main via git no longer means they're actually
# live in the database — this closes that gap.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      include_all:
        description: >-
          Pass --include-all to supabase db push. Only needed when a
          migration file's numeric prefix collides with one already applied
          remotely (e.g. the known 008_ collision, see CLAUDE.md) and the
          push refuses on ordering grounds. Leave off by default so a
          genuinely out-of-order new migration still fails loudly instead
          of being silently forced through.
        type: boolean
        default: false

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List migration status
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      # Migrations 011+ were, for a long stretch, applied to production by
      # hand (SQL editor) rather than through `supabase db push`, so their
      # DDL/data is often already live while supabase_migrations.schema_migrations
      # has no record of it — the same shape as the 008_ collision, just
      # without a filename collision to explain it. A plain `db push` aborts
      # on the first such migration with a duplicate-key/already-exists
      # error. Loop: push, and on that specific failure mode, mark just that
      # one version as applied (supabase migration repair) without
      # re-running its SQL, then retry. A genuine new-migration error (any
      # other failure) still aborts the loop instead of being papered over.
      - name: Push migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          for i in $(seq 1 30); do
            OUTPUT=$(supabase db push --db-url "$SUPABASE_DB_URL" ${{ inputs.include_all && '--include-all' || '' }} 2>&1)
            STATUS=$?
            echo "$OUTPUT"
            if [ $STATUS -eq 0 ]; then
              echo "All migrations applied."
              exit 0
            fi
            if echo "$OUTPUT" | grep -qE "duplicate key value violates unique constraint|already exists"; then
              VERSION=$(echo "$OUTPUT" | grep -oP 'Applying migration \K[0-9]+' | tail -1)
              if [ -z "$VERSION" ]; then
                echo "Push failed on pre-applied content but couldn't determine which migration version — aborting."
                exit 1
              fi
              echo "Migration $VERSION's content is already live but wasn't recorded as applied — repairing and retrying."
              supabase migration repair --status applied "$VERSION" --db-url "$SUPABASE_DB_URL"
            else
              echo "Push failed for a reason other than pre-applied content — not auto-repairing."
              exit 1
            fi
          done
          echo "Exceeded retry limit."
          exit 1

      - name: Reload PostgREST schema cache
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -c "NOTIFY pgrst, 'reload schema';"
