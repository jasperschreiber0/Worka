name: Ops diagnostic query

# One-off / repeatable read-only diagnostic runner. Not on any schedule.
# Runs an arbitrary SQL query against production via SUPABASE_DB_URL (the
# same secret supabase-migrate.yml already uses) and prints the result to
# the job log. Exists purely to give a chat-only debugging session (no
# direct DB network access) a way to inspect live production state through
# GitHub Actions, which does hold the DB credential as a repo secret.
#
# Safe by construction only in the sense that whoever can dispatch this
# workflow already has push access to main (same trust boundary as every
# other workflow here) — no new privilege is created. Intended to be
# deleted once the debugging session that added it is done, but harmless
# to leave (same "temporary but idempotent" pattern already accepted for
# vercel.json's inert cron entries elsewhere in this repo).

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'SQL to run read-only against production (wrapped in a transaction, always rolled back)'
        required: true
        type: string

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run diagnostic query (read-only, rolled back)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          QUERY: ${{ inputs.query }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
          BEGIN;
          SET LOCAL statement_timeout = '30s';
          $QUERY
          ROLLBACK;
          SQL
