name: Ops diagnostic query

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'SQL to run read-only against production (wrapped in a transaction, always rolled back)'
        required: true
        type: string

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run diagnostic query (read-only, rolled back)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          QUERY: ${{ inputs.query }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
          BEGIN;
          SET LOCAL statement_timeout = '30s';
          $QUERY
          ROLLBACK;
          SQL
