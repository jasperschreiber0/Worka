name: Document intake pipeline health check

# Runs scripts/synthetic-intake-health-check.mjs on a schedule against the
# live production Supabase project + edge functions — the one part of the
# document-processing pipeline nothing else in CI can exercise, since it
# needs a real document-worker/smooth-responder invocation, not just a
# schema check. See that script's header comment for exactly what a pass
# does and doesn't certify.
#
# SCHEDULE DISABLED (2026-07-21), deliberately, pre-first-real-estimate: this
# check creates real Storage/DB rows (cleaned up after) and, once
# classification triggers, makes real Claude API calls against production —
# a genuine, bounded, by-design cost, not a bug. It ran on a Node 20 runner
# that crashed instantly at createClient() (see git history) for several
# days, so it had been silently spending $0 despite "succeeding" on every
# scheduled run; fixing that Node bug (unrelated CI work) inadvertently
# re-activated real spend on a fixed schedule with nobody having explicitly
# decided that was wanted yet. Re-enable the `schedule:` trigger below once
# WorkA has produced real builder estimates and automated background spend
# is something you've deliberately opted back into — until then, run it
# on demand via workflow_dispatch (Actions tab -> this workflow -> Run
# workflow) whenever you want to verify the live pipeline by hand.

on:
  workflow_dispatch:
    inputs:
      diagnostic_batch_id:
        description: 'Optional: document_processing_batches.id to read-only inspect (scripts/check-batch-recovery-state.mjs) instead of running the synthetic health check'
        required: false
        type: string
      run_known_good_estimate:
        description: "Run scripts/run-known-good-estimate.mjs (a realistic bathroom-reno brief through the real /api/intake route, including pricing/QA) instead of the trivial synthetic health check -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_multitrade_known_good_estimate:
        description: "Run scripts/run-multitrade-known-good-estimate.mjs (a full 13-trade renovation+extension brief through the real /api/intake route, purpose-built to force Stage 6 to chunk -- migration 090) -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_manual_estimate_e2e:
        description: "Run scripts/run-manual-estimate-e2e.mjs -- live end-to-end check of manual estimate creation (create blank estimate, add/edit/delete line items, confirm persistence) plus its interaction with the real AI pipeline (confirm AI reuses the same quote, adds items without deleting manual ones, and an AI-generated item stays editable afterward) -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_job_costs_e2e:
        description: "Run scripts/run-job-costs-e2e.mjs -- live end-to-end check of Financials v1 (Live Job Money): create cost entries via the real API, verify actual_cost/contract_value/current_margin/current_margin_pct on the real snapshot route, delete a cost and confirm recalculation, cross-job isolation -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_variations_financial_e2e:
        description: "Run scripts/run-variations-financial-e2e.mjs -- live end-to-end check of Variations v1 (Connect Contract & Margin): raise/approve/reject variations via the real builder and client-portal routes, verify exactly-once quote_line_items representation, contract_value/current_margin update correctly, approval idempotency, persistence on fresh snapshot -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_invoicing_financial_e2e:
        description: "Run scripts/run-invoicing-financial-e2e.mjs -- live end-to-end check of Invoicing v1 (Real Cash Tracking): create/send/pay invoices via the real routes, verify invoiced/paid/outstanding on the real snapshot route, draft/status-transition safety, variation interaction, cross-builder/cross-job isolation -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_job_closeout_e2e:
        description: "Run scripts/run-job-closeout-e2e.mjs -- live end-to-end check of Job Closeout v1 (wires the existing POST /api/estimation/reconcile into JobSnapshotPanel): closes an active job with an approved variation reflected in contract value, verifies job_cost_entries/invoices/quote_line_items are unchanged, cost_reconciliation rows and the rate-learning side effect are correct, a repeat close with deliberately different entries is idempotent (proving the untouched CloseOutJobDrawer can't cause a conflicting second reconciliation), cross-builder rejection, and cleanup -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_project_memory_upsert_diagnostic:
        description: "TEMPORARY diagnostic, not part of any milestone: Run scripts/diagnose-project-memory-upsert.mjs to get the raw Postgres error (if any) from project_memory's upsert(onConflict:'job_id') -- checks whether the partial unique index on project_memory.job_id can actually be used as an ON CONFLICT arbiter -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      stage3_checkpoint_job_id:
        description: "TEMPORARY diagnostic, not part of any milestone: job_id to run scripts/diagnose-stage3-checkpoint-consistency.mjs against -- read-only, compares document_processing_batches.stage3_completed_trade_ids against the trade_category_ids actually persisted in scope_items for that job, asserting no checkpointed trade lacks real scope data. Pair with stage3_checkpoint_batch_id below."
        required: false
        type: string
        default: ''
      stage3_checkpoint_batch_id:
        description: "Optional document_processing_batches.id to pair with stage3_checkpoint_job_id above (omit to only report persisted scope_items, no checkpoint comparison)"
        required: false
        type: string
        default: ''
      classification_persistence_job_id:
        description: "TEMPORARY diagnostic, not part of any milestone: job_id to run scripts/diagnose-document-classification-persistence.mjs against -- read-only, verifies every project_documents row marked extraction_status='complete' has at least one project_facts row (no false success), and that no document has duplicate (category,key,value) facts (no duplicate persistence on retry)."
        required: false
        type: string
        default: ''
      run_job_activation_e2e:
        description: "Run scripts/run-job-activation-e2e.mjs -- live end-to-end check of the job-activation reliability fix (POST /api/jobs/[jobId]/activate): fresh activation persists quote approval + milestones + invoice schedule (verified directly against the DB, not just the response), a fully-activated job stays idempotent with no duplicate rows, a job left partially activated by a prior failure (constructed directly, not via timing) has only its missing pieces completed without duplicating what already exists, a non-canonical quote on an active job declines repair, cross-builder access is rejected -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      reset_circuit_breaker_if_safe:
        description: "Run scripts/reset-circuit-breaker-if-safe.mjs (only resets the global AI circuit breaker if the batch that tripped it has a finalized, terminal builder_status) -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      trigger_quote_pricing_qa:
        description: "Quote ID: calls the real GET /api/quotes/[quoteId] route once, triggering its existing lazy pricing (ensureQuotePriced) + QA (runQualityAssurance) backfill for an already-completed estimate that hasn't been priced yet"
        required: false
        type: string
        default: ''
      probe_quote_total_cost_write:
        description: "Quote ID: one-off diagnostic that writes a test value directly to quotes.total_cost via the Supabase client (bypassing the app) to isolate a DB-level write failure from an application-level one"
        required: false
        type: string
        default: ''
      probe_reset_to_null:
        description: "When probe_quote_total_cost_write is set: type 'true' to reset the quote's cached totals back to null instead of writing the 12345.67 test value (used to undo the probe's own test write)"
        required: false
        type: string
        default: 'false'
      run_postgrest_vs_direct_sql_test:
        description: "Run scripts/test-postgrest-vs-direct-sql.mjs -- creates its own disposable synthetic estimate_runs row, calls enforce_estimate_deadlines()/find_stuck_batches_needing_classification_retry() via the app's own PostgREST .rpc() mechanism, reports before/after state, cleans up -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_clarify_persistence_e2e:
        description: "Run scripts/run-clarify-persistence-e2e.mjs -- live end-to-end check of the reliability-audit fix to POST /api/intake/[fileId]/clarify's project_facts insert: submits an answer to a synthetic clarifying_questions row via the real route, independently verifies clarifying_questions.answer + exactly one builder_answer project_facts row, resubmits the identical answer and verifies no duplicate fact is created, checks no unrelated financial/estimate records exist, cleans up -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_completion_write_diagnostic:
        description: "TEMPORARY diagnostic, not part of any milestone: Run scripts/diagnose-completion-write-truthfulness.mjs -- read-only, platform-wide scan for files.intake_status='extracted' AND files.quote_id IS NULL (the smooth-responder final-completion-write persistence-truthfulness defect, Round 3 audit) -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_assumption_resolution_diagnostic:
        description: "TEMPORARY diagnostic, not part of any milestone: Run scripts/diagnose-assumption-resolution-truthfulness.mjs -- read-only, platform-wide scan for assumptions.resolution_type set but the linked quote_line_items.assumption_status not matching (the assumptions-resolve persistence-truthfulness defect, Round 4 audit) -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_variation_contract_diagnostic:
        description: "TEMPORARY diagnostic, not part of any milestone: Run scripts/diagnose-variation-contract-application.mjs -- read-only, platform-wide scan for variations.status='approved' with no matching quote_line_items.variation_id (the variation-approval persistence-truthfulness defect, Round 5 audit) -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_variation_approval_e2e:
        description: "Run scripts/run-variation-approval-e2e.mjs -- live end-to-end check of the variation-approval persistence-truthfulness fix: raises and approves a real variation via the deployed routes, independently verifies quote_line_items/quotes.total_cost, then calls the new retry-contract-application route and confirms no duplicate line item is created -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_assumption_resolution_e2e:
        description: "Run scripts/run-assumption-resolution-e2e.mjs -- live end-to-end check of the assumptions-resolve persistence-truthfulness fix (Round 4 audit): resolves a real assumption via the real route, independently verifies assumptions/quote_line_items/quotes state (total_cost, status, qa_report), resubmits the identical resolution and verifies no duplicate estimator_corrections row or total_cost drift, checks for duplicate quotes/line items -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
      run_email_send_failure_e2e:
        description: "Runs scripts/diagnose-email-send-failure.mjs (read-only baseline) then scripts/run-email-send-failure-e2e.mjs -- live end-to-end check of the email-draft-send persistence-truthfulness fix: sends a real, deliberately Resend-rejected email (malformed recipient) via the deployed route and verifies neither communication_history nor a proof_events email_sent row is created and a non-2xx is returned, then sends a real successful email (Resend sandbox test address) and verifies both rows ARE created -- type the literal word true to enable"
        required: false
        type: string
        default: 'false'
  # schedule:
  #   - cron: '17 */6 * * *' # every 6 hours, offset off the hour to avoid GH Actions' scheduling pile-up at :00

concurrency:
  group: intake-pipeline-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Check batch recovery state (read-only)
        if: ${{ inputs.diagnostic_batch_id != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATCH_ID: ${{ inputs.diagnostic_batch_id }}
        run: node scripts/check-batch-recovery-state.mjs

      # Cheap (one GET request), safe to run on every dispatch — no dedicated
      # input needed. Asserts the response's commit_sha against github.sha,
      # the actual commit this run was dispatched against.
      - name: Verify /api/health endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/verify-health-endpoint.mjs

      - name: Run known-good estimate (real /api/intake route, pricing + QA)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_known_good_estimate == 'true' && inputs.run_multitrade_known_good_estimate != 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/run-known-good-estimate.mjs

      - name: Run MULTI-TRADE known-good estimate (forces Stage 6 chunking -- migration 090)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_multitrade_known_good_estimate == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/run-multitrade-known-good-estimate.mjs

      - name: Run manual estimate creation E2E check (real routes, incl. AI-pipeline interaction), plus ambiguous-current-quote diagnostic + is_current-consumers fix E2E (Round 11 audit) + email-draft cost-vs-price fix E2E (Round 12 audit) + Client Quote Review & Approval E2E (Round 13 creation milestone)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_manual_estimate_e2e == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node scripts/diagnose-ambiguous-current-quote.mjs
          node scripts/run-current-quote-consumers-e2e.mjs
          node scripts/run-email-draft-cost-vs-price-e2e.mjs
          node scripts/run-quote-approval-e2e.mjs
          node scripts/run-manual-estimate-e2e.mjs

      - name: Run job costs (Financials v1) E2E check, plus supplier-rate-import persistence-truthfulness diagnostic + E2E (Round 10 audit)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_job_costs_e2e == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          node scripts/run-job-costs-e2e.mjs
          node scripts/diagnose-supplier-rate-import-unreachable.mjs
          node scripts/run-supplier-rate-import-e2e.mjs

      - name: Run variations financial connection (Variations v1) E2E check, plus quote-revise persistence-truthfulness diagnostic + E2E (Round 8 audit)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_variations_financial_e2e == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          node scripts/run-variations-financial-e2e.mjs
          node scripts/diagnose-quote-revise-truthfulness.mjs
          node scripts/run-quote-revise-truthfulness-e2e.mjs

      - name: Run invoicing financial (Invoicing v1) E2E check
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_invoicing_financial_e2e == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/run-invoicing-financial-e2e.mjs

      - name: Run job closeout (Job Closeout v1) E2E check, plus job-closeout persistence-truthfulness diagnostic + E2E (Round 7 audit)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_job_closeout_e2e == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          node scripts/run-job-closeout-e2e.mjs
          node scripts/diagnose-job-closeout-truthfulness.mjs
          node scripts/run-job-closeout-truthfulness-e2e.mjs

      - name: Diagnose project_memory upsert (TEMPORARY, not part of any milestone)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_project_memory_upsert_diagnostic == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/diagnose-project-memory-upsert.mjs

      - name: Diagnose Stage 3 checkpoint consistency (TEMPORARY, not part of any milestone)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.stage3_checkpoint_job_id != '' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ inputs.stage3_checkpoint_job_id }}
          BATCH_ID: ${{ inputs.stage3_checkpoint_batch_id }}
        run: node scripts/diagnose-stage3-checkpoint-consistency.mjs

      - name: Diagnose document-classification persistence (TEMPORARY, not part of any milestone)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.classification_persistence_job_id != '' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ inputs.classification_persistence_job_id }}
        run: node scripts/diagnose-document-classification-persistence.mjs

      - name: Run job activation reliability E2E check, plus zero-value invoice-schedule diagnostic (Round 9 audit)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_job_activation_e2e == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          node scripts/diagnose-activation-zero-schedule.mjs
          node scripts/run-job-activation-e2e.mjs

      - name: Reset circuit breaker if safe
        if: ${{ inputs.reset_circuit_breaker_if_safe == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/reset-circuit-breaker-if-safe.mjs

      - name: Trigger quote pricing + QA backfill
        if: ${{ inputs.trigger_quote_pricing_qa != '' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUOTE_ID: ${{ inputs.trigger_quote_pricing_qa }}
          BUILDER_ID: '00000000-0000-0000-0000-0000000000fc'
        run: node scripts/trigger-quote-pricing-qa.mjs

      - name: Probe quote total_cost write
        if: ${{ inputs.probe_quote_total_cost_write != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUOTE_ID: ${{ inputs.probe_quote_total_cost_write }}
          RESET_TO_NULL: ${{ inputs.probe_reset_to_null }}
        run: node scripts/probe-quote-total-cost-write.mjs

      - name: Test PostgREST RPC path vs direct SQL (enforce_estimate_deadlines / find_stuck_batches_needing_classification_retry)
        if: ${{ inputs.run_postgrest_vs_direct_sql_test == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/test-postgrest-vs-direct-sql.mjs

      - name: Run clarify-answer persistence E2E check
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_clarify_persistence_e2e == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/run-clarify-persistence-e2e.mjs

      - name: Diagnose completion-write persistence truthfulness (TEMPORARY, not part of any milestone)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_completion_write_diagnostic == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/diagnose-completion-write-truthfulness.mjs

      - name: Diagnose assumption-resolution persistence truthfulness (TEMPORARY, not part of any milestone)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_assumption_resolution_diagnostic == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/diagnose-assumption-resolution-truthfulness.mjs

      - name: Run assumption-resolution persistence E2E check
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_assumption_resolution_e2e == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/run-assumption-resolution-e2e.mjs

      - name: Diagnose variation contract-application persistence truthfulness (TEMPORARY, not part of any milestone)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_variation_contract_diagnostic == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/diagnose-variation-contract-application.mjs

      - name: Run variation approval persistence E2E check
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_variation_approval_e2e == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/run-variation-approval-e2e.mjs

      - name: Run email-draft-send persistence E2E check (with read-only baseline diagnostic)
        if: ${{ inputs.diagnostic_batch_id == '' && inputs.run_email_send_failure_e2e == 'true' && inputs.reset_circuit_breaker_if_safe != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          node scripts/diagnose-email-send-failure.mjs
          node scripts/run-email-send-failure-e2e.mjs

      - name: Run synthetic intake pipeline health check
